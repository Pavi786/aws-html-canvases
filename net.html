                        { cmd: "sysctl -w net.ipv4.ip_forward=1", desc: "Enable packet forwarding.", level: 4, detailed: "Turning your server into a 'Traffic Cop' that allows cars to pass through its intersection to other roads (makes it a router)." },
                        { cmd: "sysctl net.core.somaxconn=4096", desc: "Increase socket backlog.", level: 5, detailed: "Expanding the 'Waiting Room' size for your web server so it can handle 4096 people waiting in line instead of the default 128." },
                        { cmd: "sysctl net.ipv4.tcp_tw_reuse=1", desc: "Reuse TIME_WAIT sockets.", level: 5, detailed: "Telling the server to immediately recycle old connections that just closed, essential for high-traffic load balancers." },
                        { cmd: "tc qdisc add dev eth0 root fq", desc: "Enable Fair Queuing.", level: 5, detailed: "Telling the traffic cop to make sure NO single car hogs the road, ensuring everyone gets a fair share of the bandwidth." },
                        { cmd: "sysctl net.ipv4.tcp_fastopen=3", desc: "Enable TCP Fast Open.", level: 5, detailed: "Allowing returning visitors to skip the 'Hello' handshake and immediately start sending data to speed up page loads." },
                        { cmd: "ethtool -G eth0 rx 4096 tx 4096", desc: "Increase NIC ring buffers.", level: 5, detailed: "Giving the physical network card a much bigger 'Inbox' and 'Outbox' so it drops fewer letters during a massive storm of mail." },
                        { cmd: "sysctl -p", desc: "Reload sysctl config.", level: 4, detailed: "Telling the server to read the /etc/sysctl.conf file and apply all your custom tuning dials permanently." },
                        { cmd: "ethtool -K eth0 gro on", desc: "Enable Receive Offload.", level: 5, detailed: "Telling the network card to bundle up lots of small packages into one big one before handing it to the CPU to save processing power." }
                    ]
                },
                {
                    id: "monitoring",
                    title: "10. Monitoring",
                    icon: "📊",
                    level: 1,
                    description: "Observing bandwidth and usage over time.",
                    commands: [
                        { cmd: "iftop -i eth0", desc: "Top for network bandwidth.", level: 1, detailed: "A live, updating scoreboard showing exactly which IP addresses are currently hogging the internet speed." },
                        { cmd: "nload eth0", desc: "Visual bandwidth traffic graph.", level: 1, detailed: "A digital speedometer that shows a graph of your current download and upload speeds." },
                        { cmd: "vnstat -l", desc: "Live traffic monitoring.", level: 2, detailed: "A lightweight counter that keeps track of exactly how many Gigabytes you've used today, this week, or this month." },
                        { cmd: "nethogs eth0", desc: "Bandwidth per process.", level: 3, detailed: "Instead of showing IPs, this scoreboard shows exactly WHICH APP (like Chrome or Docker) is eating your bandwidth." },
                        { cmd: "iptraf-ng", desc: "Interactive network monitor.", level: 2, detailed: "A colorful, old-school text-based dashboard showing TCP connections, UDP traffic, and interface stats." },
                        { cmd: "sar -n DEV 1", desc: "Historical network stats.", level: 4, detailed: "The system's 'Flight Data Recorder'. It records network usage every few minutes so you can see what happened at 3 AM last night." },
                        { cmd: "bmon", desc: "Bandwidth monitor & rate.", level: 2, detailed: "A beautifully structured terminal graph showing packet rates and error rates across all interfaces at once." },
                        { cmd: "tcptrack -i eth0", desc: "Track TCP connections.", level: 3, detailed: "A monitor specifically designed to show you every single TCP connection's state (ESTABLISHED, CLOSING) and its speed." },
                        { cmd: "slurm -s -i eth0", desc: "Simple network load monitor.", level: 1, detailed: "A very minimalist ASCII graph that draws your network speed using simple text characters." }
                    ]
                },
                {
                    id: "advanced",
                    title: "11. Advanced/BPF",
                    icon: "⚡",
                    level: 5,
                    description: "Kernel-level magic and traffic shaping.",
                    commands: [
                        { cmd: "tc qdisc add dev eth0 root netem delay 100ms", desc: "Simulate network latency.", level: 5, detailed: "Purposefully sabotaging your own network to add a 100 millisecond delay. Used by developers to see how apps act on bad Wi-Fi." },
                        { cmd: "tc qdisc add dev eth0 root netem loss 5%", desc: "Simulate packet loss.", level: 5, detailed: "Telling the network card to randomly throw away 5 out of every 100 packages to test application resilience." },
                        { cmd: "bpftrace -e 'kprobe:tcp_v4_connect { printf(\"%d\\n\", pid); }'", desc: "Trace TCP connections.", level: 5, detailed: "Using eBPF to insert an invisible sensor directly into the computer's brain (kernel) to alert you the microsecond any app tries to connect out." },
                        { cmd: "tcpdrop", desc: "Trace kernel packet drops.", level: 5, detailed: "An advanced bcc-tool that watches the kernel and tells you EXACTLY why the computer decided to drop a packet (e.g., firewall, full buffer)." },
                        { cmd: "tcplife", desc: "Trace TCP session lifespans.", level: 5, detailed: "A tool that records exactly when a connection started, when it ended, and how much data was sent, without the heavy overhead of tcpdump." },
                        { cmd: "tcpretrans", desc: "Trace TCP retransmits.", level: 5, detailed: "Monitoring the network for moments when the server has to say 'I didn't get that, please send it again'. High numbers mean bad network health." },
                        { cmd: "execsnoop", desc: "Trace new processes.", level: 4, detailed: "Watching the system to see every single command that gets executed, often used to catch malicious scripts trying to make network calls." },
                        { cmd: "strace -e trace=network ping 8.8.8.8", desc: "Trace app network calls.", level: 5, detailed: "Strapping a body-cam onto the 'ping' program to watch exactly how it talks to the operating system to send its network requests." }
                    ]
                }
            ]
        };

        // --- State Management ---
        let state = {
            currentDomain: "dashboard",
            masteredCommands: new Set(),
            searchQuery: "",
            levelFilter: "all"
        };

        // --- Core Application Logic ---

        function renderNav() {
            const navContainer = document.getElementById('navContainer');
            const mobileNav = document.getElementById('mobileNav');
            navContainer.innerHTML = '';
            mobileNav.innerHTML = '';

            appData.domains.forEach(domain => {
                const btn = document.createElement('button');
                btn.className = `nav-item w-full text-left px-3 py-2 rounded-md text-sm font-medium transition-colors flex items-center gap-2 ${state.currentDomain === domain.id ? 'active' : 'text-slate-600 hover:bg-stone-100'}`;
                btn.innerHTML = `<span>${domain.icon}</span> <span class="truncate">${domain.title}</span>`;
                btn.onclick = () => switchDomain(domain.id);
                navContainer.appendChild(btn);

                const pill = document.createElement('button');
                pill.className = `flex-none px-4 py-1.5 rounded-full text-sm border ${state.currentDomain === domain.id ? 'bg-sky-600 text-white border-sky-600' : 'bg-white text-slate-600 border-stone-200'}`;
                pill.innerText = `${domain.icon} ${domain.id === 'dashboard' ? 'Overview' : domain.id.split('-')[0]}`;
                pill.onclick = () => switchDomain(domain.id);
                mobileNav.appendChild(pill);
            });
        }

        function switchDomain(domainId) {
            state.currentDomain = domainId;
            renderNav();
            renderContent();
            window.scrollTo(0,0);
        }

        function renderContent() {
            const container = document.getElementById('mainContent');
            const domain = appData.domains.find(d => d.id === state.currentDomain);
            if (!domain) return;
            container.innerHTML = '';

            const header = document.createElement('div');
            header.className = "mb-8 bg-white p-6 rounded-xl border border-stone-200 shadow-sm";
            header.innerHTML = `
                <div class="flex items-center gap-3 mb-2">
                    <span class="text-3xl p-3 bg-stone-50 rounded-lg">${domain.icon}</span>
                    <h2 class="text-2xl font-bold text-slate-800">${domain.title}</h2>
                </div>
                <p class="text-slate-600 max-w-3xl">${domain.description}</p>
            `;
            container.appendChild(header);

            if (state.currentDomain === 'dashboard') renderDashboard(container);
            else renderDomainCommands(container, domain);
        }

        function renderDashboard(container) {
            const grid = document.createElement('div');
            grid.className = "grid grid-cols-1 md:grid-cols-2 gap-6";

            const progressCard = document.createElement('div');
            progressCard.className = "bg-white p-6 rounded-xl border border-stone-200 shadow-sm";
            progressCard.innerHTML = `
                <h3 class="text-lg font-bold text-slate-800 mb-4">Skill Mastery</h3>
                <div class="chart-container"><canvas id="progressChart"></canvas></div>
            `;
            grid.appendChild(progressCard);

            const distCard = document.createElement('div');
            distCard.className = "bg-white p-6 rounded-xl border border-stone-200 shadow-sm";
            distCard.innerHTML = `
                <h3 class="text-lg font-bold text-slate-800 mb-4">Category Density</h3>
                <div class="chart-container"><canvas id="distChart"></canvas></div>
            `;
            grid.appendChild(distCard);

            container.appendChild(grid);
            setTimeout(initCharts, 0);
        }

        function renderDomainCommands(container, domain) {
            const list = document.createElement('div');
            list.className = "grid grid-cols-1 gap-4";

            const filtered = domain.commands.filter(cmd => {
                const matchesSearch = cmd.cmd.toLowerCase().includes(state.searchQuery.toLowerCase()) || 
                                      cmd.desc.toLowerCase().includes(state.searchQuery.toLowerCase());
                const matchesLevel = state.levelFilter === "all" || cmd.level.toString() === state.levelFilter;
                return matchesSearch && matchesLevel;
            });

            if (filtered.length === 0) {
                list.innerHTML = `<div class="p-12 text-center text-slate-400 bg-white rounded-xl border border-dashed border-stone-300">No tools found matching your search.</div>`;
            } else {
                filtered.forEach(cmd => {
                    const isMastered = state.masteredCommands.has(cmd.cmd);
                    const card = document.createElement('div');
                    card.className = `bg-white rounded-lg border p-4 transition-all flex items-start gap-4 ${isMastered ? 'border-green-100 bg-green-50/20' : 'border-stone-200 hover:border-sky-300'}`;
                    
                    const check = document.createElement('button');
                    check.className = `mt-1 w-6 h-6 flex-none rounded border flex items-center justify-center transition-colors ${isMastered ? 'bg-green-500 border-green-500 text-white' : 'bg-white border-stone-300 hover:border-sky-500'}`;
                    check.innerHTML = isMastered ? '✓' : '';
                    check.onclick = (e) => { e.stopPropagation(); toggleMastery(cmd.cmd); };

                    const info = document.createElement('div');
                    info.className = "flex-1 cursor-pointer";
                    info.onclick = () => showTerminalDetail(cmd);
                    info.innerHTML = `
                        <div class="flex items-center gap-2 mb-1 flex-wrap">
                            <code class="font-mono text-sky-700 font-bold text-sm md:text-base">${cmd.cmd}</code>
                            <span class="text-[10px] px-2 py-0.5 rounded-full bg-stone-100 font-bold uppercase tracking-tighter">Level ${cmd.level}</span>
                        </div>
                        <p class="text-slate-600 text-sm">${cmd.desc}</p>
                    `;

                    card.appendChild(check);
                    card.appendChild(info);
                    list.appendChild(card);
                });
            }

            container.appendChild(list);
        }

        function toggleMastery(cmdId) {
            if (state.masteredCommands.has(cmdId)) state.masteredCommands.delete(cmdId);
            else state.masteredCommands.add(cmdId);
            renderContent();
            renderNav();
            saveState();
        }

        function showTerminalDetail(cmdObj) {
            const terminal = document.getElementById('terminalOutput');
            const now = new Date().toLocaleTimeString();
            
            terminal.innerHTML = ''; 

            const head = document.createElement('div');
            head.className = "mb-4 pb-2 border-b border-slate-700 break-all";
            head.innerHTML = `<span class="text-sky-400">COMMAND:</span> <span class="text-white">${cmdObj.cmd}</span>`;

            const layman = document.createElement('div');
            layman.className = "mb-4 p-4 bg-slate-800 rounded-lg border-l-4 border-emerald-500";
            layman.innerHTML = `
                <div class="text-[10px] uppercase font-bold text-emerald-400 mb-1">The Layman Translation</div>
                <div class="text-slate-200 italic leading-relaxed text-sm">"${cmdObj.detailed}"</div>
            `;

            const meta = document.createElement('div');
            meta.className = "text-[10px] text-slate-500 mt-6";
            meta.innerHTML = `[${now}] Simulation ID: ${Math.random().toString(36).substr(2, 9).toUpperCase()}<br>Level ${cmdObj.level} logic applied.`;

            terminal.appendChild(head);
            terminal.appendChild(layman);
            terminal.appendChild(meta);
            
            const cursor = document.createElement('div');
            cursor.className = "text-emerald-500 mt-4";
            cursor.innerHTML = `$ <span class="cursor-blink">_</span>`;
            terminal.appendChild(cursor);
        }

        function setupEventListeners() {
            document.getElementById('searchInput').addEventListener('input', (e) => {
                state.searchQuery = e.target.value;
                if(state.currentDomain === 'dashboard') switchDomain('interface');
                else renderContent();
            });

            document.getElementById('levelFilter').addEventListener('change', (e) => {
                state.levelFilter = e.target.value;
                if(state.currentDomain === 'dashboard') switchDomain('interface');
                else renderContent();
            });
        }

        function initCharts() {
            const total = appData.domains.reduce((acc, d) => acc + (d.commands ? d.commands.length : 0), 0);
            const mastered = state.masteredCommands.size;
            
            const pb = document.getElementById('sidebarProgressBar');
            if(pb) pb.style.width = `${(mastered/total)*100}%`;
            const pt = document.getElementById('progressText');
            if(pt) pt.innerText = `${Math.round((mastered/total)*100)}% Mastered (${mastered}/${total})`;

            const ctx1 = document.getElementById('progressChart');
            if (ctx1) {
                new Chart(ctx1, {
                    type: 'doughnut',
                    data: {
                        labels: ['Learned', 'To Study'],
                        datasets: [{ data: [mastered, total - mastered], backgroundColor: ['#0284c7', '#e2e8f0'], borderWidth: 0 }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, cutout: '75%', plugins: { legend: { position: 'bottom' } } }
                });
            }

            const ctx2 = document.getElementById('distChart');
            if (ctx2) {
                const filtered = appData.domains.filter(d => d.commands);
                new Chart(ctx2, {
                    type: 'bar',
                    data: {
                        labels: filtered.map(d => d.title.split('.')[0]),
                        datasets: [{ label: 'Commands', data: filtered.map(d => d.commands.length), backgroundColor: '#0ea5e9' }]
                    },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false, 
                        scales: { y: { beginAtZero: true, grid: { display: false } }, x: { grid: { display: false } } },
                        plugins: { legend: { display: false } }
                    }
                });
            }
        }

        function saveState() { localStorage.setItem('netMastery_mastered', JSON.stringify([...state.masteredCommands])); }
        function loadState() {
            const saved = localStorage.getItem('netMastery_mastered');
            if (saved) state.masteredCommands = new Set(JSON.parse(saved));
            renderNav();
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            renderNav();
            renderContent();
            setupEventListeners();
            loadState();
        });

    </script>
</body>
</html>
