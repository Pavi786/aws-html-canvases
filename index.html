<html lang="en">
<head>

    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface-hover: #1f242c;
            --border: #30363d;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --accent: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.15);
            --green: #238636;
            --green-hover: #2ea043;
            --tag-aws: #ff9900;
            --tag-azure: #0078d4;
            --tag-k8s: #326ce5;
            --tag-linux: #fcc624;
            --tag-sec: #f85149;
            --tag-net: #a371f7;
            --tag-dev: #3fb950;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 30px 20px;
            line-height: 1.6;
        }
        .container { max-width: 1300px; margin: 0 auto; }
        header {
            text-align: center;
            margin-bottom: 35px;
            padding: 30px;
            background: linear-gradient(180deg, #161b22 0%, #0d1117 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        h1 {
            font-size: 2.4rem;
            font-weight: 800;
            background: linear-gradient(90deg, #58a6ff, #a371f7, #3fb950);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle {
            color: var(--text-sub);
            font-size: 1.1rem;
            max-width: 700px;
            margin: 0 auto 15px;
        }
        .stats {
            display: inline-flex;
            gap: 15px;
            padding: 8px 18px;
            background: rgba(88, 166, 255, 0.08);
            border: 1px solid var(--accent);
            border-radius: 30px;
            font-size: 0.95rem;
            color: var(--accent);
            font-weight: 600;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        .search-box {
            width: 100%;
            padding: 16px 22px;
            font-size: 1.05rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }
        .search-box:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .filter-btn {
            padding: 8px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-sub);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--accent);
            color: #0d1117;
            font-weight: 700;
            border-color: var(--accent);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s ease;
            position: relative;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: 0 10px 24px rgba(0,0,0,0.5);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 10px;
        }
        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border);
        }
        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .card-filename {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 18px;
            word-break: break-all;
        }
        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }
        .btn {
            flex: 1;
            text-align: center;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-primary {
            background: var(--green);
            color: #ffffff;
        }
        .btn-primary:hover {
            background: var(--green-hover);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background: var(--surface-hover);
            border-color: var(--text-sub);
        }
        .empty-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: var(--text-sub);
            font-size: 1.2rem;
        }
        footer {
            text-align: center;
            margin-top: 50px;
            color: var(--text-sub);
            font-size: 0.9rem;
            border-top: 1px solid var(--border);
            padding-top: 25px;
        }
    </style>
</head>

%20%282%29.html'}, {'name': 'saa-c03-complete-study-canvas.html', 'title': 'Saa C03 Complete Study Canvas', 'category': 'AWS', 'url': 'saa-c03-complete-study-canvas.html', 'preview': 'https://htmlpreview.github.io/?https://github.com/Pavi786/aws-html-canvases/blob/main/saa-c03-complete-study-canvas.html', 'github': 'https://github.com/Pavi786/aws-html-canvases/blob/main/saa-c03-complete-study-canvas.html'}, {'name': 'ssl-tls-masterclass.html', 'title': 'Ssl Tls Masterclass', 'category': 'Networking & DNS', 'url': 'ssl-tls-masterclass.html', 'preview': 'https://htmlpreview.github.io/?https://github.com/Pavi786/aws-html-canvases/blob/main/ssl-tls-masterclass.html', 'github': 'https://github.com/Pavi786/aws-html-canvases/blob/main/ssl-tls-masterclass.html'}, {'name': 'subfinder_mastery_canvas.html', 'title': 'Subfinder Mastery Canvas', 'category': 'Cybersecurity', 'url': 'subfinder_mastery_canvas.html', 'preview': 'https://htmlpreview.github.io/?https://github.com/Pavi786/aws-html-canvases/blob/main/subfinder_mastery_canvas.html', 'github': 'https://github.com/Pavi786/aws-html-canvases/blob/main/subfinder_mastery_canvas.html'}, {'name': 'sysadmin.html', 'title': 'Sysadmin', 'category': 'Linux & OS', 'url': 'sysadmin.html', 'preview': 'https://htmlpreview.github.io/?https://github.com/Pavi786/aws-html-canvases/blob/main/sysadmin.html', 'github': 'https://github.com/Pavi786/aws-html-canvases/blob/main/sysadmin.html'}, {'name': 'tools-dev.html', 'title': 'Tools Dev', 'category': 'General Study Canvases', 'url': 'tools-dev.html', 'preview': 'https://htmlpreview.github.io/?https://github.com/Pavi786/aws-html-canvases/blob/main/tools-dev.html', 'github': 'https://github.com/Pavi786/aws-html-canvases/blob/main/tools-dev.html'}, {'name': 'win-.html', 'title': 'Win ', 'category': 'General Study Canvases', 'url': 'win-.html', 'preview': 'https://htmlpreview.github.io/?https://github.com/Pavi786/aws-html-canvases/blob/main/win-.html', 'github': 'https://github.com/Pavi786/aws-html-canvases/blob/main/win-.html'}, {'name': '\ufeff97.html', 'title': '\ufeff97', 'category': 'General Study Canvases', 'url': '%EF%BB%BF97.html', 'preview': 'https://htmlpreview.github.io/?https://github.com/Pavi786/aws-html-canvases/blob/main/%EF%BB%BF97.html', 'github': 'https://github.com/Pavi786/aws-html-canvases/blob/main/%EF%BB%BF97.html'}];
        let currentFilter = 'All';
        let searchQuery = '';

        const grid = document.getElementById('cardsGrid');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');

        function render() {
            const filtered = cards.filter(c => {
                const matchesCat = currentFilter === 'All' || c.category === currentFilter;
                const matchesSearch = c.title.toLowerCase().includes(searchQuery) ||
                                      c.name.toLowerCase().includes(searchQuery) ||
                                      c.category.toLowerCase().includes(searchQuery);
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-msg">No canvases match your search criteria.</div>';
                return;
            }

            grid.innerHTML = filtered.map(c => `
                <div class="card">
                    <div>
                        <div class="card-header">
                            <span class="badge">${c.category}</span>
                        </div>
                        <h2 class="card-title">${c.title}</h2>
                        <div class="card-filename">📄 ${c.name}</div>
                    </div>
                    <div class="card-actions">
                        <a href="${c.url}" class="btn btn-primary" target="_blank">🌐 Open Canvas</a>
                        <a href="${c.preview}" class="btn btn-secondary" target="_blank" title="HTMLPreview">🔍 Preview</a>
                    </div>
                </div>
            `).join('');
        }

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            render();
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-cat');
                render();
            });
        });

        render();
    </script>
