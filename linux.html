<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linux Ultra Master for DevOps</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Terminal aesthetics */
        body { background-color: #0f172a; color: #cbd5e1; }
        .terminal-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .terminal-scroll::-webkit-scrollbar-track { background: #1e293b; }
        .terminal-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .terminal-scroll::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        /* Command block styling */
        .cmd-block { font-family: 'Courier New', Courier, monospace; }
        
        /* Smooth transitions */
        .nav-item { transition: all 0.2s ease; }
        .nav-item.active { background-color: #1e293b; border-left: 4px solid #10b981; color: #fff; font-weight: bold; }
        
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    <!-- Chosen Palette: Deep Slate (bg-slate-900) with Neon Emerald (text-emerald-400) and Cyan (text-cyan-400) accents for a "Hacker/DevOps Terminal" feel. -->
    <!-- Application Structure Plan: 
         - Layout: Two-column dashboard. Left sidebar for the 10 core modules + 1 Interview Simulator. Right pane for content.
         - Flow: Users click a module. The right pane dynamically updates with the "Layman Explanation", the "Core Commands" (with copy buttons), and real-world examples.
         - Interview Simulator: A special view that presents common outage scenarios (Disk Full, SSH slow) and provides the step-by-step command sequence to debug it, mimicking a real production outage.
         - Why this structure: DevOps requires mental models (layman explanations) paired instantly with muscle memory (copyable commands). This split layout provides both without scrolling endlessly.
    -->
    <!-- Visualization & Content Choices:
         - Visuals: Emojis and Unicode characters are used strictly in place of SVGs to maintain a raw, terminal-like aesthetic while adhering to rules.
         - Layout: Grid and Flexbox with Tailwind for a responsive, app-like feel. No scrolling on the main window, only within content panes.
         - Interactivity: JavaScript handles state changes between modules, filters commands, and copies to clipboard. No heavy external libraries needed for this text/concept-heavy application.
    -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
</head>
<body class="h-screen flex flex-col overflow-hidden font-sans antialiased selection:bg-emerald-500 selection:text-white">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-700 flex-none h-16 flex items-center justify-between px-6 z-10 shadow-md">
        <div class="flex items-center gap-3">
            <span class="text-2xl">🐧</span>
            <h1 class="text-xl font-bold text-white tracking-wider">DEVOPS <span class="text-emerald-400">ULTRA MASTER</span></h1>
        </div>
        <div class="text-xs font-mono text-slate-400 bg-slate-800 px-3 py-1 rounded-full border border-slate-700 hidden md:block">
            root@production-server:~#
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar Navigation -->
        <nav class="w-64 md:w-72 bg-slate-900 border-r border-slate-700 flex flex-col overflow-y-auto terminal-scroll py-4 shrink-0">
            <div class="px-4 mb-2 text-xs font-semibold text-slate-500 uppercase tracking-wider">Core Modules</div>
            <ul id="nav-menu" class="space-y-1">
                <!-- Injected via JS -->
            </ul>

            <div class="px-4 mt-8 mb-2 text-xs font-semibold text-emerald-500 uppercase tracking-wider">Firefighting</div>
            <ul class="space-y-1">
                <li>
                    <button onclick="loadInterviewMode()" id="nav-interview" class="nav-item w-full text-left px-4 py-3 text-slate-300 hover:bg-slate-800 flex items-center gap-3">
                        <span>🎯</span> Interview & Outage Simulator
                    </button>
                </li>
            </ul>
        </nav>

        <!-- Content Area -->
        <main class="flex-1 bg-slate-800 overflow-y-auto terminal-scroll p-4 md:p-8 relative">
            <div id="content-area" class="max-w-4xl mx-auto fade-in">
                <!-- Content dynamically injected here -->
                <div class="text-center mt-32">
                    <span class="text-6xl animate-pulse">⚡</span>
                    <h2 class="text-3xl font-bold text-white mt-6 mb-2">Booting DevOps Core...</h2>
                    <p class="text-slate-400">Select a module from the left to begin mastery.</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- Data Structure for DevOps Modules ---
        const devopsModules = [
            {
                id: 'mod1', icon: '📁', title: 'Linux Fundamentals',
                layman: `<strong>Ultra Layman Analogy: The Corporate Office Building</strong><br><br>
                         Think of the Linux Filesystem as a massive corporate office building.<br><br>
                         • <code>/</code> (Root): The ground floor lobby. Everything starts here.<br>
                         • <code>/etc</code> (Manager's Office): All the rules, configurations, and settings live here. You don't put employee data here; you put company policy here.<br>
                         • <code>/var/log</code> (Security Room): The CCTV cameras. Every error, login, and crash is recorded on tape here.<br>
                         • <code>/home</code> (Employee Lockers): Where normal users keep their personal stuff.<br>
                         • <code>/tmp</code> (Lobby Trash Can): Stuff put here gets emptied automatically when the building reboots.<br>
                         • <code>/dev</code> (Hardware Room): The physical printers, hard drives, and cables are represented here as files.`,
                commands: [
                    { cmd: "pwd", desc: "Print Working Directory", example: "Where am I currently standing in the building?" },
                    { cmd: "ls", desc: "List files", example: "What is inside this room?" },
                    { cmd: "ls -l", desc: "List with details", example: "Show me the files, who owns them, and their size." },
                    { cmd: "ls -a", desc: "List all (including hidden)", example: "Show me the secret files that start with a dot (like .env)." },
                    { cmd: "ls -lh", desc: "List human readable", example: "Show sizes in MB/GB instead of raw bytes." },
                    { cmd: "cd /var/log", desc: "Change Directory", example: "Walk into the security camera room." },
                    { cmd: "cd ..", desc: "Go up one level", example: "Walk out of the current room into the hallway." },
                    { cmd: "cd -", desc: "Go back to previous", example: "Jump back to the room I was just in before this one." },
                    { cmd: "cd ~", desc: "Go to home", example: "Teleport straight to my personal locker." },
                    { cmd: "cp file.txt /tmp/", desc: "Copy a file", example: "Photocopy a document and put it in the trash room." },
                    { cmd: "cp -r /app /backup", desc: "Copy a folder recursively", example: "Copy the whole 'app' department into the 'backup' department." },
                    { cmd: "mv app.py /opt/", desc: "Move a file", example: "Relocate this script to the /opt directory." },
                    { cmd: "mv old.txt new.txt", desc: "Rename a file", example: "Moving a file in the same room just renames it." },
                    { cmd: "rm error.log", desc: "Remove a file", example: "Shred this document forever." },
                    { cmd: "rm -r /old_app", desc: "Remove a folder", example: "Demolish this entire room and everything inside it." },
                    { cmd: "rm -rf /tmp/cache", desc: "Force remove folder", example: "Demolish the room, don't ask me for permission, just do it. (DANGEROUS)" },
                    { cmd: "mkdir /app", desc: "Make directory", example: "Build a new room called 'app'." },
                    { cmd: "mkdir -p /app/src/logs", desc: "Make nested directories", example: "Build a room, a closet inside it, and a safe inside the closet all at once." },
                    { cmd: "rmdir /empty", desc: "Remove empty directory", example: "Demolish the room, but only if nobody left anything inside." },
                    { cmd: "touch .env", desc: "Create empty file", example: "Create a blank piece of paper called .env." },
                    { cmd: "cat config.yml", desc: "Read entire file", example: "Read the whole configuration file and dump it on my screen." },
                    { cmd: "tac log.txt", desc: "Read file backwards", example: "Read the log file starting from the bottom (newest) to top." },
                    { cmd: "less auth.log", desc: "Page through file", example: "Open a giant log file but let me scroll with arrow keys without crashing my terminal." },
                    { cmd: "head -n 20 file.txt", desc: "Read top 20 lines", example: "Just show me the header/beginning of this massive CSV file." },
                    { cmd: "tail -n 50 error.log", desc: "Read bottom 50 lines", example: "Show me the last 50 errors that just happened." },
                    { cmd: "find / -name '*.conf'", desc: "Search entire disk", example: "Search the whole building (/) for any file ending in .conf." },
                    { cmd: "find . -type f -mtime -7", desc: "Find recently modified", example: "Find files in this folder changed in the last 7 days." },
                    { cmd: "grep 'failed' auth.log", desc: "Search text inside file", example: "Read the security log and highlight every line with the word 'failed'." },
                    { cmd: "grep -i 'ERROR' app.log", desc: "Case insensitive search", example: "Find 'error', 'ERROR', or 'Error'." },
                    { cmd: "grep -r 'DB_PASS' /etc/", desc: "Recursive text search", example: "Search EVERY file inside the /etc folder for the database password." }
                ]
            },
            {
                id: 'mod2', icon: '🏃', title: 'Processes (PID)',
                layman: `<strong>Ultra Layman Analogy: The Factory Floor</strong><br><br>
                         Everything running in Linux is a "Process", which is just a worker on the factory floor.<br><br>
                         • <strong>PID (Process ID):</strong> The worker's employee badge number. You need this to give them orders.<br>
                         • <strong>Zombie Process:</strong> A worker who was fired, but HR hasn't removed them from the payroll system. They do no work, but they clog up the system.<br>
                         • <strong>Background Job (&):</strong> Telling a worker "Go do this in the back room, I don't want to watch you do it."<br>
                         • <strong>OOM (Out of Memory):</strong> When the factory floor is too crowded, the Linux Boss comes in and shoots the biggest worker to save the factory.`,
                commands: [
                    { cmd: "ps", desc: "Process Status", example: "Show me the workers I personally spawned in this terminal." },
                    { cmd: "ps aux", desc: "List all processes", example: "Show me every single worker in the entire factory and what they are doing." },
                    { cmd: "ps -ef | grep python", desc: "Find specific process", example: "Search the factory floor specifically for workers running Python scripts." },
                    { cmd: "top", desc: "Live process monitor", example: "Look down at the factory floor from a balcony and see who is sweating the most (CPU usage)." },
                    { cmd: "htop", desc: "Interactive top (better)", example: "A colorful, modern version of top where I can click and sort workers easily." },
                    { cmd: "pgrep nginx", desc: "Get PID by name", example: "Just give me the badge number (PID) of the nginx worker." },
                    { cmd: "pidof mysql", desc: "Get PID of program", example: "Find the exact badge number of the database worker." },
                    { cmd: "kill 1234", desc: "Graceful kill (SIGTERM)", example: "Tap worker #1234 on the shoulder and ask them nicely to pack up their desk and leave." },
                    { cmd: "kill -9 1234", desc: "Force kill (SIGKILL)", example: "Worker #1234 has gone crazy. Security immediately tackles them. No graceful shutdown." },
                    { cmd: "killall php-fpm", desc: "Kill by name", example: "Fire every single worker in the 'php-fpm' department simultaneously." },
                    { cmd: "pkill -f bad_script.sh", desc: "Kill by pattern", example: "Fire anyone whose job description matches 'bad_script.sh'." },
                    { cmd: "nice -n 10 ./script.sh", desc: "Start with low priority", example: "Tell this worker they are not important; let others use the CPU first." },
                    { cmd: "renice -n -5 -p 1234", desc: "Change running priority", example: "Tell the boss to give worker #1234 VIP access to the CPU right now." },
                    { cmd: "nohup ./long_job.sh &", desc: "No hangup background", example: "Start a massive data backup. Even if I close my laptop and disconnect, keep working!" },
                    { cmd: "sleep 100 &", desc: "Run in background", example: "Start a task but put it in the background so I can keep typing in my terminal." },
                    { cmd: "jobs", desc: "List background jobs", example: "Show me all the workers I sent to the back room." },
                    { cmd: "fg %1", desc: "Bring job to foreground", example: "Bring job #1 from the back room back to my terminal screen." },
                    { cmd: "bg %1", desc: "Resume in background", example: "If I paused a task with Ctrl+Z, tell it to resume working in the back room." },
                    { cmd: "disown -a", desc: "Detach jobs from terminal", example: "I am logging off, tell all background workers they no longer report to me." },
                    { cmd: "screen", desc: "Terminal multiplexer", example: "Open a magical virtual window. If my internet drops, the window stays open on the server." },
                    { cmd: "tmux", desc: "Modern multiplexer", example: "Like screen, but better. Split my terminal into 4 panes for intense debugging." },
                    { cmd: "watch -n 1 'free -m'", desc: "Execute periodically", example: "Run the memory check command every 1 second and show me a live changing dashboard." },
                    { cmd: "uptime", desc: "System uptime and load", example: "How long has this server been awake, and how stressed (Load Average) is it?" },
                    { cmd: "pstree", desc: "Process tree diagram", example: "Show me a family tree of which worker hired which sub-worker." },
                    { cmd: "fuser -k 80/tcp", desc: "Kill process on port", example: "Find whoever is hogging port 80 and instantly kill them." },
                    { cmd: "lsof -p 1234", desc: "List open files by PID", example: "What exact files is worker #1234 currently holding open?" },
                    { cmd: "time ./script.sh", desc: "Measure execution time", example: "Run this script and tell me exactly how many seconds it took to finish." },
                    { cmd: "timeout 10s ping 8.8.8.8", desc: "Run with time limit", example: "Run this ping command, but absolutely kill it if it takes longer than 10 seconds." },
                    { cmd: "systemd-cgtop", desc: "Control group top", example: "Show me which Docker container or system service is eating the most resources." },
                    { cmd: "strace -p 1234", desc: "Trace system calls", example: "ULTRA DEBUGGING: Attach a wiretap to worker #1234 and watch every microscopic action they take." }
                ]
            },
            {
                id: 'mod3', icon: '🧠', title: 'Memory Management',
                layman: `<strong>Ultra Layman Analogy: The Desk and The Filing Cabinet</strong><br><br>
                         • <strong>RAM (Memory):</strong> The physical top of your work desk. Things you are working on <em>right now</em> go here. It's incredibly fast, but small.<br>
                         • <strong>Swap:</strong> A metal filing cabinet down the hall. When your desk gets too full, you move older papers to the cabinet to prevent spilling. It saves you from crashing, but walking to the cabinet (Swap) makes the system incredibly slow.<br>
                         • <strong>Buff/Cache:</strong> Linux hates empty desk space. It keeps old documents on the corner of the desk just in case you need them again. It will instantly throw them away if a real program needs the space. <em>(High cache is a good thing!)</em>`,
                commands: [
                    { cmd: "free -m", desc: "Memory in MB", example: "Look at the desk. How much is used, free, and cached in Megabytes?" },
                    { cmd: "free -g", desc: "Memory in GB", example: "Look at the desk in Gigabytes for massive database servers." },
                    { cmd: "vmstat 1 5", desc: "Virtual memory stats", example: "Take 5 snapshots of the memory and CPU usage, 1 second apart, to spot sudden spikes." },
                    { cmd: "pmap 1234", desc: "Process memory map", example: "Show me exactly which libraries in RAM worker #1234 is using." },
                    { cmd: "smem -r -k", desc: "Report memory by process", example: "A smarter tool that shows true memory usage (PSS) instead of shared memory illusions." },
                    { cmd: "cat /proc/meminfo", desc: "Raw memory data", example: "Read the direct, raw sensors from the Linux kernel about the RAM." },
                    { cmd: "top -o %MEM", desc: "Top sorted by RAM", example: "Show me the process list, but put the biggest memory hogs at the very top." },
                    { cmd: "ps -eo pid,ppid,cmd,%mem,%cpu --sort=-%mem", desc: "Custom PS memory sort", example: "Print a clean list of exactly who is using the most RAM right now." },
                    { cmd: "swapon -s", desc: "Show swap usage", example: "Look at the filing cabinet down the hall. Is it being used?" },
                    { cmd: "swapon -a", desc: "Enable all swap", example: "Turn on the filing cabinet so the system can use it." },
                    { cmd: "swapoff -a", desc: "Disable all swap", example: "Lock the filing cabinet. Force everything back onto the desk (RAM). DANGEROUS." },
                    { cmd: "mkswap /dev/sdb1", desc: "Format swap partition", example: "Build a brand new filing cabinet out of a new hard drive." },
                    { cmd: "sysctl vm.swappiness", desc: "Check swappiness", example: "How eager is Linux to use the filing cabinet? (0 = never, 100 = always)." },
                    { cmd: "sysctl -w vm.swappiness=10", desc: "Reduce swappiness", example: "Tell Linux: Please try to keep things on the desk (RAM) unless absolutely necessary." },
                    { cmd: "dmesg | grep -i oom", desc: "Check for OOM Killer", example: "The server crashed. Did the Linux Boss (Out Of Memory killer) shoot a process to save the OS?" },
                    { cmd: "sync", desc: "Flush buffers to disk", example: "Tell the OS to write all pending desk paperwork permanently to the hard drive right now." },
                    { cmd: "echo 1 > /proc/sys/vm/drop_caches", desc: "Clear PageCache", example: "Throw away the cached files on the corner of the desk. (Usually unnecessary)." },
                    { cmd: "echo 2 > /proc/sys/vm/drop_caches", desc: "Clear inodes/dentries", example: "Throw away the cached folder structures in memory." },
                    { cmd: "echo 3 > /proc/sys/vm/drop_caches", desc: "Clear all caches", example: "NUKE ALL CACHES. Free up max memory for testing. Do not use in production." },
                    { cmd: "slabtop", desc: "Kernel slab cache info", example: "Look at how much memory the Linux Kernel itself is using for internal operations." },
                    { cmd: "cat /proc/slabinfo", desc: "Raw slab data", example: "Raw data for the slabtop command." },
                    { cmd: "cat /proc/buddyinfo", desc: "Memory fragmentation", example: "Is my RAM chopped up into tiny unusable blocks, or do I have large contiguous chunks available?" },
                    { cmd: "sar -r 1 3", desc: "Historical memory stats", example: "(Requires sysstat) Show me memory usage from the system's historical data gathering." },
                    { cmd: "numastat", desc: "NUMA architecture stats", example: "On massive servers with 2+ physical CPUs, check if memory is being routed efficiently between chips." },
                    { cmd: "ipcs -m", desc: "Shared memory segments", example: "Show me memory that multiple programs (like PostgreSQL workers) are sharing." },
                    { cmd: "ipcrm -m <shmid>", desc: "Remove shared memory", example: "A database crashed and left ghost memory behind. Forcefully wipe it out." },
                    { cmd: "mlock", desc: "Lock memory (concept)", example: "(C code concept) Pin this memory to the desk so it NEVER gets pushed to the Swap cabinet." },
                    { cmd: "vmtouch -t /path/to/file", desc: "Force file into RAM", example: "I have a giant database index. Force Linux to load it into RAM instantly for speed." },
                    { cmd: "vmtouch -e /path/to/file", desc: "Evict file from RAM", example: "Kick this giant video file out of the RAM cache to make room." },
                    { cmd: "valgrind ./my_app", desc: "Find memory leaks", example: "Developer tool: Run the C/C++ app and track if it forgets to give memory back when done." }
                ]
            },
            {
                id: 'mod4', icon: '💾', title: 'Disk & Storage',
                layman: `<strong>Ultra Layman Analogy: The Warehouse and The Barcodes</strong><br><br>
                         A hard drive in Linux has two absolute limits:<br>
                         1. <strong>Blocks (Space):</strong> The physical square footage of the warehouse.<br>
                         2. <strong>Inodes (Barcodes):</strong> A roll of barcode stickers. <em>Every single file needs exactly 1 sticker.</em><br><br>
                         <strong>The DevOps Trap:</strong> You can have an empty warehouse (1TB free space), but if you have millions of tiny 1-kilobyte files, you run out of barcode stickers (Inodes). The system will scream "Disk Full" and crash, even though it looks empty!`,
                commands: [
                    { cmd: "df -h", desc: "Disk space human readable", example: "How much physical space (Gigabytes) is left in the partitions?" },
                    { cmd: "df -i", desc: "Check Inodes", example: "THE TRAP: Are we out of barcode stickers? Check the %IUse column!" },
                    { cmd: "du -sh /var/log", desc: "Folder size summary", example: "How heavy is the /var/log directory in total?" },
                    { cmd: "du -h --max-depth=1 /", desc: "Find giant folders", example: "Scan the root directory and show me which top-level folder is eating the most space." },
                    { cmd: "lsblk", desc: "List block devices", example: "Show me the raw physical hard drives attached to this VM (e.g., sda, nvme0n1)." },
                    { cmd: "blkid", desc: "Block ID attributes", example: "Find the UUID (unique serial number) of a hard drive so I can mount it permanently." },
                    { cmd: "fdisk -l", desc: "List partitions", example: "Show me how the hard drives are chopped up into partitions." },
                    { cmd: "parted -l", desc: "List partitions (Large disks)", example: "Better tool for modern disks larger than 2 Terabytes (GPT)." },
                    { cmd: "mkfs.ext4 /dev/sdb1", desc: "Format as ext4", example: "Take this raw partition and format it with the standard Linux ext4 file system." },
                    { cmd: "mkfs.xfs /dev/sdb1", desc: "Format as XFS", example: "Format it as XFS, better for massive databases and huge files." },
                    { cmd: "fsck /dev/sdb1", desc: "File system check", example: "The server lost power. Run a repair tool to fix corrupted sectors on the disk." },
                    { cmd: "mount /dev/sdb1 /mnt/data", desc: "Mount a drive", example: "Attach the new hard drive to the /mnt/data folder so I can actually put files in it." },
                    { cmd: "umount /mnt/data", desc: "Unmount a drive", example: "Safely eject the hard drive from that folder." },
                    { cmd: "cat /etc/fstab", desc: "File system table", example: "The master list of drives that mount automatically when the server boots. If you mess this up, the server dies." },
                    { cmd: "tune2fs -l /dev/sda1", desc: "View ext4 metadata", example: "Look deep into the file system settings (when was it created, when was it last checked)." },
                    { cmd: "hdparm -tT /dev/sda", desc: "Test read speed", example: "Benchmark the hard drive to see if the cloud provider is giving me terrible IOPS." },
                    { cmd: "smartctl -a /dev/sda", desc: "Check disk health", example: "Ask the physical hard drive hardware if it is about to die (SMART status)." },
                    { cmd: "iostat -x 1", desc: "Live I/O stats", example: "Are my disks the bottleneck? Check the %util and %iowait live." },
                    { cmd: "iotop", desc: "Top for disk usage", example: "Like 'top' for CPU, but shows exactly which process is reading/writing to the disk the hardest." },
                    { cmd: "lsof +D /var/log", desc: "List open files in dir", example: "I can't unmount this drive because 'device is busy'. Who is holding a file open in here?" },
                    { cmd: "find / -type f -size +500M", desc: "Find massive files", example: "Hunt down any file larger than 500MB causing the disk to fill up." },
                    { cmd: "ncdu /", desc: "Interactive disk usage", example: "(Needs install) The absolute best interactive CLI tool to hunt down what is eating your disk space." },
                    { cmd: "tree -sh /var/log", desc: "Visual folder tree", example: "Print a visual tree of folders and their file sizes." },
                    { cmd: "pvcreate /dev/sdb", desc: "LVM: Physical Volume", example: "LVM Magic Step 1: Initialize raw disk for Logical Volume Manager." },
                    { cmd: "vgcreate data_vg /dev/sdb", desc: "LVM: Volume Group", example: "LVM Magic Step 2: Create a storage pool called 'data_vg'." },
                    { cmd: "lvcreate -L 50G -n app_lv data_vg", desc: "LVM: Logical Volume", example: "LVM Magic Step 3: Carve a flexible 50GB partition out of the pool." },
                    { cmd: "lvs", desc: "List logical volumes", example: "Show me the flexible LVM partitions I created." },
                    { cmd: "vgs", desc: "List volume groups", example: "Show me the LVM storage pools and their free space." },
                    { cmd: "pvs", desc: "List physical volumes", example: "Show me the physical disks backing the LVM pools." },
                    { cmd: "resize2fs /dev/mapper/data_vg-app_lv", desc: "Expand file system", example: "I added more space to the VM in AWS. Now tell the OS to actually expand to use it." }
                ]
            },
            {
                id: 'mod5', icon: '🔐', title: 'Users & Permissions',
                layman: `<strong>Ultra Layman Analogy: The Nightclub Bouncer</strong><br><br>
                         Every file and folder is a VIP room in a nightclub.<br>
                         • <strong>Owner:</strong> The person who rented the room.<br>
                         • <strong>Group:</strong> The VIP guest list.<br>
                         • <strong>Others:</strong> Random people off the street.<br><br>
                         Permissions are Read (r=4), Write (w=2), Execute (x=1).<br>
                         <code>chmod 777</code> means you gave maximum access (4+2+1) to the Owner, the Group, and Everyone off the street. This is a massive security breach.<br>
                         <code>sudo</code> (Super User Do) is wearing the Club Manager's badge for exactly one command to bypass the bouncer.`,
                commands: [
                    { cmd: "id", desc: "Print user identity", example: "Who am I logged in as, and what groups do I belong to?" },
                    { cmd: "whoami", desc: "Print username", example: "Literally just print my username. Useful in scripts." },
                    { cmd: "who", desc: "Show logged in users", example: "Who else is currently connected to this server?" },
                    { cmd: "w", desc: "Show users and activity", example: "Who is logged in, where did they connect from, and what command are they running right now?" },
                    { cmd: "groups ubuntu", desc: "Show user's groups", example: "Show me the VIP lists the 'ubuntu' user is on." },
                    { cmd: "useradd -m devops", desc: "Create new user", example: "Hire a new employee named 'devops' and build them a home locker (-m)." },
                    { cmd: "usermod -aG docker devops", desc: "Add user to group", example: "Append (-a) the 'devops' user to the 'docker' VIP group so they can run containers." },
                    { cmd: "userdel -r devops", desc: "Delete user", example: "Fire the employee and instantly incinerate their home locker (-r)." },
                    { cmd: "groupadd developers", desc: "Create new group", example: "Create a new VIP list called 'developers'." },

            },
            {
                title: "🚨 Server is extremely slow / High CPU",
                desc: "SSH takes forever to connect. Everything is lagging.",
                steps: [
                    { act: "1. Find the culprit", cmd: "htop", reason: "Sort by CPU%. Identify the PID of the rogue process." },
                    { act: "2. Check disk I/O wait", cmd: "iostat -x 1", reason: "Is the CPU slow, or is it waiting for a slow hard drive (%iowait)?" },
                    { act: "3. Check Memory & Swap", cmd: "free -m", reason: "If RAM is full and it's using Swap, the server will crawl. Kill memory hogs." },
                    { act: "4. Kill the rogue process", cmd: "kill -15 <PID>", reason: "Ask it nicely to stop. If it refuses, use 'kill -9 <PID>'." }
                ]
            },
            {
                title: "🚨 'No Space Left on Device' Error",
                desc: "Applications are crashing, database won't start, complaining about disk space.",
                steps: [
                    { act: "1. Verify Block Space", cmd: "df -h", reason: "Check if any partition (like / or /var) is at 100% Use." },
                    { act: "2. Verify Inode Space (The Trap)", cmd: "df -i", reason: "If df -h says 50% used, but df -i says 100%, you have millions of tiny files." },
                    { act: "3. Find the giant files", cmd: "du -sh /* | sort -rh | head -10", reason: "Find which top-level folder is hoarding the space." },
                    { act: "4. Safely empty log files", cmd: "echo '' > /var/log/huge_file.log", reason: "DO NOT 'rm' a live log file, the space won't free up! Truncate it instead using echo." }
                ]
            }
        ];

        // --- DOM Elements ---
        const navMenu = document.getElementById('nav-menu');
        const contentArea = document.getElementById('content-area');

        // --- Initialization ---
        function init() {
            // Build Sidebar
            devopsModules.forEach(mod => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <button onclick="loadModule('${mod.id}')" id="nav-${mod.id}" class="nav-item w-full text-left px-4 py-3 text-slate-300 hover:bg-slate-800 flex items-center gap-3">
                        <span class="text-xl">${mod.icon}</span> <span class="text-sm font-medium leading-tight">${mod.title}</span>
                    </button>
                `;
                navMenu.appendChild(li);
            });
            
            // Load first module by default
            loadModule('mod1');
        }

        // --- Core Logic ---
        function loadModule(id) {
            clearNavActive();
            document.getElementById(`nav-${id}`).classList.add('active');

            const mod = devopsModules.find(m => m.id === id);
            
            let cmdsHtml = mod.commands.map(c => `
                <div class="bg-slate-900 border border-slate-700 rounded-lg p-4 mb-4 relative group">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-emerald-400 font-bold text-sm">${c.desc}</span>
                        <button onclick="copyCmd(this, '${c.cmd.replace(/'/g, "\\'")}')" class="text-xs bg-slate-700 hover:bg-slate-600 text-white px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0 ml-2">Copy</button>
                    </div>
                    <code class="cmd-block text-cyan-300 block text-sm md:text-lg mb-3 break-all bg-slate-950 p-2 rounded shadow-inner border border-slate-800 select-all">$ ${c.cmd}</code>
                    <div class="text-slate-400 text-sm italic border-l-2 border-slate-600 pl-3">
                        " ${c.example} "
                    </div>
                </div>
            `).join('');

            contentArea.innerHTML = `
                <div class="fade-in">
                    <div class="flex items-center gap-4 mb-6 border-b border-slate-700 pb-4">
                        <span class="text-4xl bg-slate-900 p-3 rounded-xl border border-slate-700 shadow-lg shrink-0">${mod.icon}</span>
                        <div>
                            <h2 class="text-2xl md:text-3xl font-bold text-white tracking-tight">${mod.title}</h2>
                            <span class="text-xs font-mono text-emerald-500 mt-1 block">Total Commands: ${mod.commands.length}</span>
                        </div>
                    </div>
                    
                    <div class="bg-slate-700/30 border border-slate-600 rounded-xl p-4 md:p-6 mb-8 text-slate-300 leading-relaxed shadow-inner text-sm md:text-base">
                        ${mod.layman}
                    </div>

                    <h3 class="text-xl font-bold text-white mb-4 flex items-center gap-2"><span class="text-emerald-500">>></span> Production Commands</h3>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                        ${cmdsHtml}
                    </div>
                </div>
            `;
        }

        function loadInterviewMode() {
            clearNavActive();
            document.getElementById('nav-interview').classList.add('active');

            let scenariosHtml = outageScenarios.map(s => `
                <div class="bg-slate-900 border border-red-900/50 rounded-xl p-4 md:p-6 mb-6 shadow-lg relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1 h-full bg-red-500"></div>
                    <h3 class="text-xl font-bold text-white mb-2">${s.title}</h3>
                    <p class="text-slate-400 text-sm mb-5">${s.desc}</p>
                    
                    <div class="space-y-3">
                        ${s.steps.map(step => `
                            <div class="bg-slate-950 border border-slate-800 rounded p-3 flex flex-col lg:flex-row lg:items-center gap-3">
                                <div class="lg:w-1/3 text-sm font-semibold text-emerald-400">${step.act}</div>
                                <div class="lg:w-1/3"><code class="text-cyan-300 font-mono text-sm bg-slate-900 px-2 py-1 rounded border border-slate-700 break-all cursor-pointer hover:bg-slate-800 block w-full" onclick="copyCmd(this, '${step.cmd}')" title="Click to copy">$ ${step.cmd}</code></div>
                                <div class="lg:w-1/3 text-xs text-slate-500 italic">${step.reason}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            contentArea.innerHTML = `
                <div class="fade-in">
                    <div class="mb-8 border-b border-slate-700 pb-4">
                        <h2 class="text-2xl md:text-3xl font-bold text-white tracking-tight flex items-center gap-3">
                            <span class="animate-pulse">🔴</span> Real-World Outage Simulator
                        </h2>
                        <p class="text-slate-400 mt-2 text-sm md:text-base">In an interview (or at 3 AM on-call), you must debug calmly. Don't guess. Follow the data. Click any command to copy.</p>
                    </div>
                    ${scenariosHtml}
                </div>
            `;
        }

        // --- Utilities ---
        function clearNavActive() {
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
        }

        function copyCmd(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.innerText;
                btn.innerText = "Copied!";
                btn.classList.add("bg-emerald-600", "text-white");
                btn.classList.remove("bg-slate-700", "text-cyan-300");
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.remove("bg-emerald-600", "text-white");
                    // Reset to original class based on where it was clicked from
                    if(originalText === 'Copy') btn.classList.add("bg-slate-700");
                    else btn.classList.add("text-cyan-300"); 
                }, 1500);
            });
        }

        // Start App
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
