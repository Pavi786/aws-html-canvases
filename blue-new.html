    <style>
        /* Pro Dark Theme Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        .chart-container {
            position: relative; width: 100%; max-width: 600px;
            height: 300px; max-height: 400px; margin-left: auto; margin-right: auto;
        }

        /* Terminal typing effect cursor */
        .cursor-blink { animation: blink 1s step-end infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Animations */
        .fade-in-up { animation: fadeInUp 0.4s ease-out forwards; opacity: 0; transform: translateY(10px); }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        /* Active navigation state */
        .nav-item.active {
            background-color: rgba(14, 165, 233, 0.1); 
            border-right: 4px solid #38bdf8;
            color: #f8fafc;
        }

        /* Toast */
        #toast {
            visibility: hidden; min-width: 250px; background-color: #10b981; color: #fff;
            text-align: center; border-radius: 8px; padding: 12px; position: fixed; z-index: 50;
            left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 14px; box-shadow: 0 4px 15px rgba(16,185,129,0.4);
            transition: visibility 0.3s, bottom 0.3s, opacity 0.3s; opacity: 0;
        }
        #toast.show { visibility: visible; bottom: 50px; opacity: 1; }
    </style>
</head>

                        { cmd: "ip link set eth0 master br0", desc: "Attach interface to bridge.", level: 3, detailed: "Taking a physical cable and plugging it directly into the virtual 'Power Strip' (bridge)." },
                        { cmd: "tunctl -t tap0", desc: "Create a TAP interface.", level: 4, detailed: "Creating a fake network card for a Virtual Machine to use, simulating a real physical cable connection." },
                        { cmd: "ip link add link eth0 macvlan", desc: "Create a MACVLAN.", level: 4, detailed: "Cloning your network card so a container can have its very own physical MAC address on the network." },
                        { cmd: "wireguard show", desc: "Check WireGuard VPN status.", level: 3, detailed: "Checking the status of the ultra-fast, encrypted tunnel you've built to a remote network." },
                        { cmd: "ip netns exec blue bash", desc: "Enter a namespace.", level: 4, detailed: "Putting on a virtual reality headset and physically stepping inside one of the 'Parallel Universes' to run commands from within." }
                    ]
                },
                {
                    id: "dns",
                    title: "8. DNS/Names",
                    icon: "🌍",
                    level: 1,
                    description: "Translating human names to machine numbers.",
                    commands: [
                        { cmd: "resolvectl query google.com", desc: "Modern DNS lookup.", level: 1, detailed: "Asking the system's official 'Information Desk' (systemd-resolved) for the phone number of a specific company." },
                        { cmd: "cat /etc/resolv.conf", desc: "Check DNS server config.", level: 1, detailed: "Reading the sticky note that tells your server which Phonebook Company (like 8.8.8.8) it should call." },
                        { cmd: "dig +short example.com", desc: "Get only the IP address.", level: 1, detailed: "Asking for a phone number and saying 'Just give me the numbers, no extra fluff or pleasantries.'" },
                        { cmd: "dig -x 8.8.8.8", desc: "Reverse DNS lookup.", level: 2, detailed: "Having a phone number and looking it up in a reverse-phonebook to figure out who owns it." },
                        { cmd: "whois domain.com", desc: "Domain registration info.", level: 1, detailed: "Looking up the public registry to see exactly who bought a domain name, when it expires, and where they live." },
                        { cmd: "getent hosts google.com", desc: "Check system resolver.", level: 2, detailed: "Asking the server exactly how it resolves a name, checking both local files (/etc/hosts) and external DNS servers." },
                        { cmd: "resolvectl flush-caches", desc: "Clear local DNS cache.", level: 2, detailed: "Erasing the server's memory of recent phone numbers so it is forced to call the Phonebook Company again." },
                        { cmd: "rndc status", desc: "Check BIND DNS server.", level: 4, detailed: "If you ARE the Phonebook Company, this checks if your massive phonebook server is running smoothly." },
                        { cmd: "nscd -i hosts", desc: "Invalidate nscd cache.", level: 3, detailed: "Clearing out the older Name Service Cache Daemon's memory of domain names." }
                    ]
                },
                {
                    id: "tuning",
                    title: "9. Tuning",
                    icon: "🏎️",
                    level: 4,
                    description: "Making the network fast under heavy load.",
                    commands: [
                        { cmd: "sysctl -a | grep net", desc: "List all network tunables.", level: 4, detailed: "Opening the 'Advanced Settings' menu of your server to see every tiny dial and switch you can adjust." },
                        { cmd: "sysctl -w net.ipv4.ip_forward=1", desc: "Enable packet forwarding.", level: 4, detailed: "Turning your server into a 'Traffic Cop' that allows cars to pass through its intersection to other roads (makes it a router)." },
                        { cmd: "sysctl net.core.somaxconn=4096", desc: "Increase socket backlog.", level: 5, detailed: "Expanding the 'Waiting Room' size for your web server so it can handle 4096 people waiting in line instead of the default 128." },
                        { cmd: "sysctl net.ipv4.tcp_tw_reuse=1", desc: "Reuse TIME_WAIT sockets.", level: 5, detailed: "Telling the server to immediately recycle old connections that just closed, essential for high-traffic load balancers." },
                        { cmd: "tc qdisc add dev eth0 root fq", desc: "Enable Fair Queuing.", level: 5, detailed: "Telling the traffic cop to make sure NO single car hogs the road, ensuring everyone gets a fair share of the bandwidth." },
                        { cmd: "sysctl net.ipv4.tcp_fastopen=3", desc: "Enable TCP Fast Open.", level: 5, detailed: "Allowing returning visitors to skip the 'Hello' handshake and immediately start sending data to speed up page loads." },
                        { cmd: "ethtool -G eth0 rx 4096 tx 4096", desc: "Increase NIC ring buffers.", level: 5, detailed: "Giving the physical network card a much bigger 'Inbox' and 'Outbox' so it drops fewer letters during a massive storm of mail." },
                        { cmd: "sysctl -p", desc: "Reload sysctl config.", level: 4, detailed: "Telling the server to read the /etc/sysctl.conf file and apply all your custom tuning dials permanently." },
                        { cmd: "ethtool -K eth0 gro on", desc: "Enable Receive Offload.", level: 5, detailed: "Telling the network card to bundle up lots of small packages into one big one before handing it to the CPU to save processing power." }
                    ]
                },
                {
                    id: "monitoring",
                    title: "10. Monitoring",
                    icon: "📊",
                    level: 1,
                    description: "Observing bandwidth and usage over time.",
                    commands: [
                        { cmd: "iftop -i eth0", desc: "Top for network bandwidth.", level: 1, detailed: "A live, updating scoreboard showing exactly which IP addresses are currently hogging the internet speed." },
                        { cmd: "nload eth0", desc: "Visual bandwidth traffic graph.", level: 1, detailed: "A digital speedometer that shows a graph of your current download and upload speeds." },
                        { cmd: "vnstat -l", desc: "Live traffic monitoring.", level: 2, detailed: "A lightweight counter that keeps track of exactly how many Gigabytes you've used today, this week, or this month." },
                        { cmd: "nethogs eth0", desc: "Bandwidth per process.", level: 3, detailed: "Instead of showing IPs, this scoreboard shows exactly WHICH APP (like Chrome or Docker) is eating your bandwidth." },
                        { cmd: "iptraf-ng", desc: "Interactive network monitor.", level: 2, detailed: "A colorful, old-school text-based dashboard showing TCP connections, UDP traffic, and interface stats." },
                        { cmd: "sar -n DEV 1", desc: "Historical network stats.", level: 4, detailed: "The system's 'Flight Data Recorder'. It records network usage every few minutes so you can see what happened at 3 AM last night." },
                        { cmd: "bmon", desc: "Bandwidth monitor & rate.", level: 2, detailed: "A beautifully structured terminal graph showing packet rates and error rates across all interfaces at once." },
                        { cmd: "tcptrack -i eth0", desc: "Track TCP connections.", level: 3, detailed: "A monitor specifically designed to show you every single TCP connection's state (ESTABLISHED, CLOSING) and its speed." },
                        { cmd: "slurm -s -i eth0", desc: "Simple network load monitor.", level: 1, detailed: "A very minimalist ASCII graph that draws your network speed using simple text characters." }
                    ]
                },
                {
                    id: "advanced",
                    title: "11. Advanced/BPF",
                    icon: "⚡",
                    level: 5,
                    description: "Kernel-level magic and traffic shaping.",
                    commands: [
                        { cmd: "tc qdisc add dev eth0 root netem delay 100ms", desc: "Simulate network latency.", level: 5, detailed: "Purposefully sabotaging your own network to add a 100 millisecond delay. Used by developers to see how apps act on bad Wi-Fi." },
                        { cmd: "tc qdisc add dev eth0 root netem loss 5%", desc: "Simulate packet loss.", level: 5, detailed: "Telling the network card to randomly throw away 5 out of every 100 packages to test application resilience." },
                        { cmd: "bpftrace -e 'kprobe:tcp_v4_connect { printf(\"%d\\n\", pid); }'", desc: "Trace TCP connections.", level: 5, detailed: "Using eBPF to insert an invisible sensor directly into the computer's brain (kernel) to alert you the microsecond any app tries to connect out." },
                        { cmd: "tcpdrop", desc: "Trace kernel packet drops.", level: 5, detailed: "An advanced bcc-tool that watches the kernel and tells you EXACTLY why the computer decided to drop a packet (e.g., firewall, full buffer)." },
                        { cmd: "tcplife", desc: "Trace TCP session lifespans.", level: 5, detailed: "A tool that records exactly when a connection started, when it ended, and how much data was sent, without the heavy overhead of tcpdump." },
                        { cmd: "tcpretrans", desc: "Trace TCP retransmits.", level: 5, detailed: "Monitoring the network for moments when the server has to say 'I didn't get that, please send it again'. High numbers mean bad network health." },
                        { cmd: "execsnoop", desc: "Trace new processes.", level: 4, detailed: "Watching the system to see every single command that gets executed, often used to catch malicious scripts trying to make network calls." },
                        { cmd: "strace -e trace=network ping 8.8.8.8", desc: "Trace app network calls.", level: 5, detailed: "Strapping a body-cam onto the 'ping' program to watch exactly how it talks to the operating system to send its network requests." }
                    ]
                }
            ]
        };

        // --- State Management ---
        let state = {
            currentDomain: "dashboard",
            masteredCommands: new Set(),
            searchQuery: "",
            levelFilter: "all",
            currentTerminalCmd: ""
        };

        // --- Core Application Logic ---

        function renderNav() {
            const navContainer = document.getElementById('navContainer');
            const mobileNav = document.getElementById('mobileNav');
            navContainer.innerHTML = '';
            mobileNav.innerHTML = '';

            appData.domains.forEach(domain => {
                const btn = document.createElement('button');
                btn.className = `nav-item w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition-all duration-200 flex items-center gap-3 ${state.currentDomain === domain.id ? 'active' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`;
                btn.innerHTML = `<span class="text-lg">${domain.icon}</span> <span class="truncate">${domain.title}</span>`;
                btn.onclick = () => switchDomain(domain.id);
                navContainer.appendChild(btn);

                const pill = document.createElement('button');
                pill.className = `flex-none px-4 py-2 rounded-full text-sm font-medium transition-all duration-200 border ${state.currentDomain === domain.id ? 'bg-sky-500/20 text-sky-400 border-sky-500/50' : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'}`;
                pill.innerText = `${domain.icon} ${domain.id === 'dashboard' ? 'Overview' : domain.id.split('-')[0]}`;
                pill.onclick = () => switchDomain(domain.id);
                mobileNav.appendChild(pill);
            });
        }

        function switchDomain(domainId) {
            state.currentDomain = domainId;
            renderNav();
            renderContent();
            window.scrollTo(0,0);
        }

        function renderContent() {
            const container = document.getElementById('mainContent');
            const domain = appData.domains.find(d => d.id === state.currentDomain);
            if (!domain) return;
            container.innerHTML = '';

            const header = document.createElement('div');
            header.className = "mb-8 bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl fade-in-up relative overflow-hidden";
            header.innerHTML = `
                <div class="absolute top-0 right-0 w-32 h-32 bg-sky-500/5 rounded-full blur-3xl"></div>
                <div class="flex items-center gap-4 mb-3 relative z-10">
                    <span class="text-4xl p-4 bg-slate-800 rounded-xl shadow-inner border border-slate-700">${domain.icon}</span>
                    <div>
                        <h2 class="text-3xl font-bold text-slate-100 mb-1 tracking-tight">${domain.title}</h2>
                        ${domain.level ? `<span class="inline-block px-2.5 py-0.5 rounded-full bg-slate-800 text-sky-400 text-[10px] font-bold uppercase tracking-widest border border-slate-700">Difficulty: Level ${domain.level}</span>` : ''}
                    </div>
                </div>
                <p class="text-slate-400 max-w-3xl relative z-10 ml-2 border-l-2 border-slate-700 pl-4">${domain.description}</p>
            `;
            container.appendChild(header);

            if (state.currentDomain === 'dashboard') renderDashboard(container);
            else renderDomainCommands(container, domain);
        }

        function renderDashboard(container) {
            const grid = document.createElement('div');
            grid.className = "grid grid-cols-1 md:grid-cols-2 gap-6 fade-in-up";
            grid.style.animationDelay = "0.1s";

            const progressCard = document.createElement('div');
            progressCard.className = "bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-lg relative overflow-hidden";
            progressCard.innerHTML = `
                <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-sky-500/10 rounded-full blur-3xl"></div>
                <h3 class="text-xl font-bold text-slate-200 mb-6 flex items-center gap-2"><svg class="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> Skill Mastery</h3>
                <div class="chart-container"><canvas id="progressChart"></canvas></div>
            `;
            grid.appendChild(progressCard);

            const distCard = document.createElement('div');
            distCard.className = "bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-lg relative overflow-hidden";
            distCard.innerHTML = `
                <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-purple-500/10 rounded-full blur-3xl"></div>
                <h3 class="text-xl font-bold text-slate-200 mb-6 flex items-center gap-2"><svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg> Category Density</h3>
                <div class="chart-container"><canvas id="distChart"></canvas></div>
            `;
            grid.appendChild(distCard);

            container.appendChild(grid);
            setTimeout(initCharts, 0);
        }

        function renderDomainCommands(container, domain) {
            const list = document.createElement('div');
            list.className = "grid grid-cols-1 gap-4";

            const filtered = domain.commands.filter(cmd => {
                const matchesSearch = cmd.cmd.toLowerCase().includes(state.searchQuery.toLowerCase()) || 
                                      cmd.desc.toLowerCase().includes(state.searchQuery.toLowerCase());
                const matchesLevel = state.levelFilter === "all" || cmd.level.toString() === state.levelFilter;
                return matchesSearch && matchesLevel;
            });

            if (filtered.length === 0) {
                list.innerHTML = `<div class="p-12 text-center text-slate-500 bg-slate-900 rounded-2xl border border-dashed border-slate-700 fade-in-up">No tools found matching your search.</div>`;
            } else {
                filtered.forEach((cmd, idx) => {
                    const isMastered = state.masteredCommands.has(cmd.cmd);
                    const card = document.createElement('div');
                    card.className = `fade-in-up bg-slate-900 rounded-xl border p-5 transition-all duration-300 flex items-start gap-5 group hover:shadow-[0_0_20px_rgba(0,0,0,0.3)] ${isMastered ? 'border-emerald-500/50 bg-emerald-900/10' : 'border-slate-800 hover:border-sky-500/50'}`;
                    card.style.animationDelay = `${idx * 0.05}s`;
                    
                    const check = document.createElement('button');
                    check.className = `mt-1 w-7 h-7 flex-none rounded-lg border flex items-center justify-center transition-all duration-300 ${isMastered ? 'bg-emerald-500 border-emerald-500 text-white shadow-[0_0_10px_rgba(16,185,129,0.4)]' : 'bg-slate-800 border-slate-600 text-transparent hover:border-sky-400 group-hover:border-sky-500/50'}`;
                    check.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                    check.onclick = (e) => { e.stopPropagation(); toggleMastery(cmd.cmd); };

                    const info = document.createElement('div');
                    info.className = "flex-1 cursor-pointer";
                    info.onclick = () => showTerminalDetail(cmd);
                    info.innerHTML = `
                        <div class="flex items-center gap-3 mb-2 flex-wrap">
                            <code class="font-mono text-sky-400 font-bold text-sm md:text-base tracking-wide bg-slate-950 px-2 py-1 rounded border border-slate-800">${cmd.cmd}</code>
                            <span class="text-[10px] px-2.5 py-1 rounded-md bg-slate-800 text-slate-400 font-bold uppercase tracking-widest border border-slate-700">Level ${cmd.level}</span>
                        </div>
                        <p class="text-slate-400 text-sm">${cmd.desc}</p>
                    `;

                    card.appendChild(check);
                    card.appendChild(info);
                    list.appendChild(card);
                });
            }

            container.appendChild(list);
        }

        function toggleMastery(cmdId) {
            if (state.masteredCommands.has(cmdId)) {
                state.masteredCommands.delete(cmdId);
            } else {
                state.masteredCommands.add(cmdId);
                showToast("Command Mastered!");
            }
            renderContent();
            renderNav();
            saveState();
        }

        function showTerminalDetail(cmdObj) {
            state.currentTerminalCmd = cmdObj.cmd;
            const terminal = document.getElementById('terminalOutput');
            const copyBtn = document.getElementById('copyBtn');
            const now = new Date().toLocaleTimeString('en-US', { hour12: false });
            
            terminal.innerHTML = ''; 
            copyBtn.classList.remove('hidden');

            const head = document.createElement('div');
            head.className = "mb-5 pb-3 border-b border-slate-800 break-all";
            head.innerHTML = `<span class="text-sky-500 font-bold">EXEC:</span> <span class="text-slate-200 bg-slate-800 px-2 py-1 rounded">${cmdObj.cmd}</span>`;

            const layman = document.createElement('div');
            layman.className = "mb-5 p-5 bg-slate-900 rounded-xl border-l-4 border-emerald-500 shadow-inner relative overflow-hidden fade-in-up";
            layman.innerHTML = `
                <div class="absolute -right-4 -top-4 w-16 h-16 bg-emerald-500/10 rounded-full blur-xl"></div>
                <div class="text-[10px] uppercase font-bold text-emerald-500 mb-2 tracking-widest flex items-center gap-2">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Layman Translation
                </div>
                <div class="text-slate-300 italic leading-relaxed text-sm">"${cmdObj.detailed}"</div>
            `;

            const meta = document.createElement('div');
            meta.className = "text-[10px] text-slate-500 mt-8 font-sans bg-slate-900/50 inline-block px-3 py-1 rounded-full fade-in-up";
            meta.style.animationDelay = "0.1s";
            meta.innerHTML = `[${now}] PID: ${Math.floor(Math.random()*9000)+1000} | L${cmdObj.level} Logic`;

            terminal.appendChild(head);
            terminal.appendChild(layman);
            terminal.appendChild(meta);
            
            const cursor = document.createElement('div');
            cursor.className = "text-emerald-500 mt-6 font-bold fade-in-up";
            cursor.style.animationDelay = "0.2s";
            cursor.innerHTML = `$ <span class="cursor-blink">_</span>`;
            terminal.appendChild(cursor);
        }

        function copyCurrentCmd() {
            if(!state.currentTerminalCmd) return;
            navigator.clipboard.writeText(state.currentTerminalCmd).then(() => {
                showToast("Command Copied!");
            });
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2500);
        }

        function resetProgress() {
            if(confirm("Are you sure you want to reset all your mastered progress?")) {
                state.masteredCommands.clear();
                saveState();
                renderContent();
                renderNav();
                showToast("Progress Reset");
            }
        }

        function setupEventListeners() {
            document.getElementById('searchInput').addEventListener('input', (e) => {
                state.searchQuery = e.target.value;
                if(state.currentDomain === 'dashboard') switchDomain('interface');
                else renderContent();
            });

            document.getElementById('levelFilter').addEventListener('change', (e) => {
                state.levelFilter = e.target.value;
                if(state.currentDomain === 'dashboard') switchDomain('interface');
                else renderContent();
            });
        }

        // Setup Chart.js global defaults for Dark Mode
        Chart.defaults.color = '#94a3b8'; // slate-400
        Chart.defaults.font.family = 'ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

        function initCharts() {
            const total = appData.domains.reduce((acc, d) => acc + (d.commands ? d.commands.length : 0), 0);
            const mastered = state.masteredCommands.size;
            
            const pb = document.getElementById('sidebarProgressBar');
            if(pb) pb.style.width = `${(mastered/total)*100}%`;
            const pt = document.getElementById('progressText');
            if(pt) pt.innerText = `${Math.round((mastered/total)*100)}% Mastered (${mastered}/${total})`;

            const ctx1 = document.getElementById('progressChart');
            if (ctx1) {
                new Chart(ctx1, {
                    type: 'doughnut',
                    data: {
                        labels: ['Mastered', 'Remaining'],
                        datasets: [{ 
                            data: [mastered, total - mastered], 
                            backgroundColor: ['#10b981', '#1e293b'], // emerald-500, slate-800
                            borderColor: ['#047857', '#0f172a'],
                            borderWidth: 2,
                            hoverOffset: 4
                        }]
                    },
                    options: { 
                        responsive: true, maintainAspectRatio: false, cutout: '75%', 
                        plugins: { legend: { position: 'bottom', labels: { padding: 20 } } },
                        animation: { animateScale: true, animateRotate: true }
                    }
                });
            }

            const ctx2 = document.getElementById('distChart');
            if (ctx2) {
                const filtered = appData.domains.filter(d => d.commands);
                new Chart(ctx2, {
                    type: 'bar',
                    data: {
                        labels: filtered.map(d => d.title.split('.')[0].trim()),
                        datasets: [{ 
                            label: 'Commands', 
                            data: filtered.map(d => d.commands.length), 
                            backgroundColor: '#38bdf8', // sky-400
                            borderRadius: 6,
                            borderSkipped: false
                        }]
                    },
                    options: { 
                        responsive: true, maintainAspectRatio: false, 
                        scales: { 
                            y: { beginAtZero: true, grid: { color: '#1e293b', drawBorder: false } }, 
                            x: { grid: { display: false, drawBorder: false } } 
                        },
                        plugins: { legend: { display: false } },
                        animation: {
                            y: { duration: 1000, easing: 'easeOutQuart' }
                        }
                    }
                });
            }
        }

        function saveState() { localStorage.setItem('netMastery_mastered_v2', JSON.stringify([...state.masteredCommands])); }
        function loadState() {
            const saved = localStorage.getItem('netMastery_mastered_v2');
            if (saved) state.masteredCommands = new Set(JSON.parse(saved));
            renderNav();
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            renderNav();
            renderContent();
            setupEventListeners();
            loadState();
        });

    </script>
</body>
</html>
